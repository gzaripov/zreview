<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f8fa; --line: #d0d7de; --fg: #1f2328; --muted: #656d76;
    --accent: #0969da; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --ok-bg: #dafbe1; --bad-bg: #ffebe9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --line: #30363d; --fg: #e6edf3; --muted: #8b949e;
      --accent: #58a6ff; --ok: #3fb950; --warn: #d29922; --bad: #f85149; --ok-bg: #12261e; --bad-bg: #2d1416;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--fg); background: var(--bg); }
  a { color: var(--accent); }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  code { background: var(--panel); padding: 1px 5px; border-radius: 4px; }
  pre { background: var(--panel); padding: 12px; border-radius: 6px; overflow: auto; }
  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--line); background: var(--panel); padding: 20px 16px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  aside h1 { font-size: 15px; margin: 0 0 4px; line-height: 1.3; }
  aside .meta { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  aside .exposure { font-size: 13px; padding: 8px 10px; border-left: 3px solid var(--warn); background: var(--bg); margin-bottom: 18px; border-radius: 0 4px 4px 0; }
  nav button { display: flex; width: 100%; text-align: left; align-items: center; gap: 8px; padding: 9px 10px; margin-bottom: 4px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--fg); font: inherit; cursor: pointer; }
  nav button:hover { background: var(--bg); }
  nav button.active { background: var(--bg); border-color: var(--line); font-weight: 600; }
  nav .n { color: var(--muted); font-variant-numeric: tabular-nums; width: 1.6em; }
  .badge { margin-left: auto; font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
  .badge.approved { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
  .badge.changes { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
  .tally { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .tally button { display: block; width: 100%; margin-top: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; cursor: pointer; }
  .tally button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .tally button:disabled { opacity: .5; cursor: default; }
  .tally .done { margin-top: 10px; padding: 10px; border-radius: 6px; background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  main { padding: 28px 40px 80px; max-width: 980px; }
  main h2 { font-size: 24px; margin: 0 0 6px; }
  .section { margin-top: 28px; }
  .section h3 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .scenario { font-size: 17px; padding: 14px 18px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 0 6px 6px 0; }
  .prose p { margin: 0 0 12px; }
  figure { margin: 0 0 18px; }
  figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .diagram { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; overflow: auto; }
  .diagram svg { max-width: 100%; height: auto; }
  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .shots figure { border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: var(--panel); }
  .shots img { width: 100%; height: auto; border-radius: 4px; display: block; }
  .shots .label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .none { color: var(--muted); font-style: italic; }
  ul.files { list-style: none; padding: 0; margin: 0; }
  ul.files li { padding: 4px 0; }
  .decide { margin-top: 36px; padding: 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .decide .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .decide button { padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
  .decide button.approve.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .decide button.changes.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .decide textarea { width: 100%; margin-top: 12px; min-height: 64px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; resize: vertical; }
  .decide .state { font-size: 13px; color: var(--muted); }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); } .shots { grid-template-columns: 1fr; } main { padding: 20px; } }
</style>
</head>
<body>
<script id="review-data" type="application/json">__REVIEW_JSON__</script>
<div class="layout">
  <aside>
    <h1 id="pr-title"></h1>
    <div class="meta" id="pr-meta"></div>
    <div class="exposure" id="pr-exposure"></div>
    <nav id="nav"></nav>
    <div class="tally">
      <div id="tally"></div>
      <button id="submit" class="primary" hidden>Submit review</button>
      <div id="submitted" class="done" hidden>Submitted. You can close this tab.</div>
      <button id="copy">Copy review summary</button>
      <button id="export">Export decisions.json</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script>
(() => {
  const data = JSON.parse(document.getElementById('review-data').textContent);
  const served = __SERVED__;
  let submitted = false;
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'strict' });
  marked.setOptions({ mangle: false, headerIds: false });

  const key = `zreview:${data.pr.repo}#${data.pr.number}@${data.pr.head}`;
  const load = () => { try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch { return {}; } };
  const save = (s) => localStorage.setItem(key, JSON.stringify(s));
  let state = load();
  let current = location.hash.slice(1) || (data.features[0] && data.features[0].id);

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const md = (s) => s ? marked.parse(s) : '';

  document.getElementById('pr-title').textContent = data.pr.title;
  document.getElementById('pr-meta').innerHTML =
    `<a href="${esc(data.pr.url)}">${esc(data.pr.repo)}#${data.pr.number}</a> · <code>${esc(data.pr.head)}</code> → ${esc(data.pr.base)}`;
  document.getElementById('pr-exposure').textContent = data.pr.exposure || '';
  if (served) document.getElementById('submit').hidden = false;

  function renderNav() {
    const nav = document.getElementById('nav');
    nav.innerHTML = data.features.map((f, i) => {
      const d = state[f.id]?.decision;
      const badge = d === 'approved' ? 'approved' : d === 'changes' ? 'changes' : 'open';
      return `<button data-id="${esc(f.id)}" class="${f.id === current ? 'active' : ''}">
        <span class="n">${i + 1}</span><span>${esc(f.title)}</span><span class="badge ${badge}">${badge}</span></button>`;
    }).join('');
    nav.querySelectorAll('button').forEach(b => b.onclick = () => { current = b.dataset.id; location.hash = current; render(); });
    const n = data.features.length, a = data.features.filter(f => state[f.id]?.decision === 'approved').length,
          c = data.features.filter(f => state[f.id]?.decision === 'changes').length;
    document.getElementById('tally').textContent = `${a} approved · ${c} changes requested · ${n - a - c} open`;
  }

  function shots(s) {
    if (!s) return `<p class="none">No user-visible surface, so no screenshots.</p>`;
    const fig = (label, src) => src ? `<figure><div class="label">${label}</div><img src="${src}" alt="${label}"></figure>` : '';
    return `<div class="shots">${fig('Before', s.before_src)}${fig('After', s.after_src)}</div>` +
           (s.caption ? `<figcaption>${esc(s.caption)}</figcaption>` : '');
  }

  async function render() {
    renderNav();
    const f = data.features.find(x => x.id === current) || data.features[0];
    const main = document.getElementById('main');
    if (!f) { main.innerHTML = '<p class="none">No features in review.json.</p>'; return; }
    const st = state[f.id] || {};
    const diagrams = (f.diagrams || []).length
      ? f.diagrams.map((d, i) => `<figure><div class="diagram"><pre class="mermaid" id="mm-${i}">${esc(d.mermaid)}</pre></div><figcaption>${esc(d.title || '')}</figcaption></figure>`).join('')
      : `<p class="none">No flow or boundary change, so no diagram.</p>`;
    const files = (f.files || []).map(x => `<li><a href="${esc(x.url)}"><code>${esc(x.path)}</code></a></li>`).join('');

    main.innerHTML = `
      <h2>${esc(f.title)}</h2>
      <div class="section"><h3>User scenario</h3><div class="scenario">${esc(f.scenario || '')}</div></div>
      <div class="section"><h3>What changed</h3><div class="prose">${md(f.description)}</div></div>
      <div class="section"><h3>Architecture</h3>${diagrams}</div>
      <div class="section"><h3>Before / after</h3>${shots(f.screenshots)}</div>
      <div class="section"><h3>Files</h3>${files ? `<ul class="files">${files}</ul>` : '<p class="none">No files listed.</p>'}</div>
      <div class="section"><h3>How it was tested</h3><div class="prose">${md(f.tested) || '<p class="none">Not stated.</p>'}</div></div>
      <div class="decide">
        <div class="row">
          <button class="approve ${st.decision === 'approved' ? 'on' : ''}" ${submitted ? 'disabled' : ''}>Approve</button>
          <button class="changes ${st.decision === 'changes' ? 'on' : ''}" ${submitted ? 'disabled' : ''}>Request changes</button>
          <span class="state">${st.decision ? `Decided ${new Date(st.at).toLocaleString()}` : 'No decision yet'}</span>
        </div>
        <textarea placeholder="Note for the author (optional)" ${submitted ? 'disabled' : ''}>${esc(st.note || '')}</textarea>
      </div>`;

    const decide = (decision) => { state[f.id] = { decision, note: main.querySelector('textarea').value, at: Date.now() }; save(state); render(); };
    main.querySelector('.approve').onclick = () => decide('approved');
    main.querySelector('.changes').onclick = () => decide('changes');
    main.querySelector('textarea').onblur = (e) => { if (state[f.id]) { state[f.id].note = e.target.value; save(state); } };

    if ((f.diagrams || []).length) {
      try { await mermaid.run({ nodes: main.querySelectorAll('pre.mermaid') }); }
      catch (e) { main.querySelectorAll('pre.mermaid').forEach(p => p.insertAdjacentHTML('afterend', `<p class="none">Diagram failed to render: ${esc(e.message)}</p>`)); }
    }
  }

  function summary() {
    const lines = [`## Review of ${data.pr.repo}#${data.pr.number} at \`${data.pr.head}\``, ''];
    data.features.forEach((f, i) => {
      const s = state[f.id] || {};
      const mark = s.decision === 'approved' ? '✅ Approved' : s.decision === 'changes' ? '❌ Changes requested' : '⬜ Not reviewed';
      lines.push(`${i + 1}. **${f.title}** — ${mark}${s.note ? `\n   > ${s.note.replace(/\n/g, '\n   > ')}` : ''}`);
    });
    return lines.join('\n');
  }

  document.getElementById('copy').onclick = async (e) => { await navigator.clipboard.writeText(summary()); e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy review summary', 1500); };
  document.getElementById('export').onclick = () => {
    const blob = new Blob([JSON.stringify({ key, decisions: state }, null, 2)], { type: 'application/json' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `decisions-${data.pr.number}.json` }); a.click();
  };
  document.getElementById('submit').onclick = async (e) => {
    e.target.disabled = true;
    const r = await fetch('/api/decision', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ features: state, summary: summary() }) });
    if (!r.ok) { e.target.disabled = false; return; }
    submitted = true;
    e.target.hidden = true;
    document.getElementById('submitted').hidden = false;
    render();
  };
  addEventListener('pagehide', () => { if (served && !submitted) navigator.sendBeacon('/api/dismiss'); });
  addEventListener('hashchange', () => { current = location.hash.slice(1) || current; render(); });
  render();
})();
</script>
</body>
</html>
